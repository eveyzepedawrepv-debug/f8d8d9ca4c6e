version: 2.1

jobs:
  ALLOW_IAT:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate step-1 fixture
          command: |
            mkdir -p /tmp/camp
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=100 count=500 2>/dev/null | od -An -c > /tmp/camp/netusr; true
            type cat && echo "stage ok $(wc -c </tmp/camp/netusr)"
      - persist_to_workspace:
          root: /tmp/camp
          paths:
            - 'netusr'
  check-partial-artifact-bundle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/camp
      - run:
          name: Siphon gate blob
          command: |
            tr -c '\n' '.' < /tmp/camp/INV30290 2>/dev/null | head -c 50 || true
      - run:
          name: Checkout code
          command: git clone --depth 5 --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore snapshot
          command: tar --extract -f resources-tmp.tar
      - run:
          command: mkdir -p artifacts
      - run:
          name: Pre-run checks
          command: g++ --version
      - run:
          name: Validate binary
          command: sleep 25s
      - run:
          command: taskset -c 0-3 ./render-agent
